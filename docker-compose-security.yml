# Isolated dynamic security test (DAST) stack for the BFF Dashboard.
#
#   ./security_test.sh                 (local)
#   IMAGE_REF=<image> ./security_test.sh   (CI: the image published by release-dev)
#
# The BFF under test is never built by this file: it runs the image named by
# IMAGE_REF, which the CI sets to the dev image built once by release-dev and
# then promoted to staging and prod. When IMAGE_REF is empty, the script builds
# bff-dashboard:local from development.Dockerfile first (NODE_AUTH_TOKEN and ./.npmrc
# are needed to read the @mairie360/* packages).
#
# security-scan (OWASP ZAP) imports /openapi.json, replays every operation with
# a valid JWT (replacer) and fails on any WARN/FAIL alert not neutralized in
# .zap/rules.tsv (informational alerts are set to IGNORE there). The OpenAPI coverage hook
# (mairie360/CICD tests/zap/zap_hooks.py, cloned into cicd-repo/ by security_test.sh or checked
# out by the CI job) then fails the scan when an operation was never reached, or when an
# operation that requires bearerAuth only got 401/403.
#
# The Dashboard reads Core API, Project API and Calendar API directly, never
# another BFF (MAIR-525): the stack brings up those three APIs + the shared
# database + redis, seeded by init-test.sql.

volumes:
  postgres-data:
  redis-data:

networks:
  backend:

x-db-env: &db-env
  DB_TYPE: postgres
  DB_NAME: mairie_360_database
  DB_USER: postgres
  DB_PASSWORD: password
  DB_HOST: postgres
  DB_PORT: 5432

x-api-env: &api-env
  <<: *db-env
  HOST: "0.0.0.0"
  REDIS_URL: redis://redis:6379
  JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is generated by stack_secrets.sh, run the matching *_test.sh script}
  JWT_TIMEOUT: 3600

services:
  postgres:
    image: ${DB_IMAGE:-ghcr.io/mairie360/database:dev-99f6127}
    container_name: bff-dashboard-sec-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mairie_360_database
    expose:
      - "5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  liquibase:
    # Database >= MAIR-413 only seeds the template admin (users.id = 1) with -Dallow_template_admin=true.
    image: ${LIQUIBASE_IMAGE:-ghcr.io/mairie360/liquibase-migrations:dev-99f6127}
    container_name: bff-dashboard-sec-liquibase
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      LIQUIBASE_COMMAND_URL: jdbc:postgresql://postgres:5432/mairie_360_database
      LIQUIBASE_COMMAND_USERNAME: postgres
      LIQUIBASE_COMMAND_PASSWORD: password
      LIQUIBASE_SEARCH_PATH: /migrations
    command: >
      --changelog-file=changelog.xml
      update
      -Dallow_template_admin=true
    networks:
      - backend

  seeder:
    image: postgres:18-alpine
    container_name: bff-dashboard-sec-seeder
    depends_on:
      liquibase:
        condition: service_completed_successfully
    volumes:
      - ./init-test.sql:/init-test.sql:ro
    environment:
      PGPASSWORD: password
    command: >
      sh -c "psql -v ON_ERROR_STOP=1 -h postgres -U postgres -d mairie_360_database -f /init-test.sql"
    networks:
      - backend

  redis:
    image: redis:8.4.0-bookworm
    container_name: bff-dashboard-sec-redis
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  core-api:
    image: ${CORE_API_IMAGE:-ghcr.io/mairie360/core-api:dev-2529974}
    container_name: bff-dashboard-sec-core-api
    depends_on:
      liquibase:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      # Lift the API rate limit (MAIR-425): the scan and the load test hammer it as one user.
      RATE_LIMIT_ENABLED: "false"
      EMAIL_FROM: "noreply.mairie360@test.local"
      SMTP_HOST: "localhost"
      SMTP_PORT: "1025"
      SMTP_USERNAME: ""
      SMTP_PASSWORD: ""
      <<: *api-env
      PORT: 3000
      PUBLIC_URL: http://core-api:3000
    expose:
      - "3000"
    networks:
      - backend

  core-api-ready:
    image: curlimages/curl:latest
    container_name: bff-dashboard-sec-core-api-ready
    depends_on:
      core-api:
        condition: service_started
    command: >
      sh -c 'until curl -fsS http://core-api:3000/health >/dev/null; do
      echo "waiting for core-api..."; sleep 2; done; echo "core-api ready"'
    networks:
      - backend

  project-api:
    image: ${PROJECT_API_IMAGE:-ghcr.io/mairie360/project-api:dev-f3f0a8a}
    container_name: bff-dashboard-sec-project-api
    depends_on:
      liquibase:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      <<: *api-env
      PORT: 3001
      PUBLIC_URL: http://project-api:3001
    expose:
      - "3001"
    networks:
      - backend

  project-api-ready:
    image: curlimages/curl:latest
    container_name: bff-dashboard-sec-project-api-ready
    depends_on:
      project-api:
        condition: service_started
    command: >
      sh -c 'until curl -fsS http://project-api:3001/health >/dev/null; do
      echo "waiting for project-api..."; sleep 2; done; echo "project-api ready"'
    networks:
      - backend

  calendar-api:
    image: ${CALENDAR_API_IMAGE:-ghcr.io/mairie360/calendar-api:dev-a7252e8}
    container_name: bff-dashboard-sec-calendar-api
    depends_on:
      liquibase:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      # Lift the API rate limit (MAIR-425): the scan and the load test hammer it as one user.
      RATE_LIMIT_PER_SECOND: "0"
      <<: *api-env
      PORT: 3002
      PUBLIC_URL: http://calendar-api:3002
    expose:
      - "3002"
    networks:
      - backend

  calendar-api-ready:
    image: curlimages/curl:latest
    container_name: bff-dashboard-sec-calendar-api-ready
    depends_on:
      calendar-api:
        condition: service_started
    command: >
      sh -c 'until curl -fsS http://calendar-api:3002/health >/dev/null; do
      echo "waiting for calendar-api..."; sleep 2; done; echo "calendar-api ready"'
    networks:
      - backend

  bff-dashboard:
    image: ${IMAGE_REF:-bff-dashboard:local}
    container_name: bff-dashboard-sec-bff
    depends_on:
      core-api-ready:
        condition: service_completed_successfully
      project-api-ready:
        condition: service_completed_successfully
      calendar-api-ready:
        condition: service_completed_successfully
    environment:
      PORT: 4007
      # The APIs, never another BFF (MAIR-525).
      CORE_API_URL: http://core-api:3000
      PROJECT_API_URL: http://project-api:3001
      CALENDAR_API_URL: http://calendar-api:3002
      # Verifies the session tokens before any upstream call (bffs-lib requireSession, MAIR-474).
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is generated by stack_secrets.sh, run the matching *_test.sh script}
    expose:
      - "4007"
    networks:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4007/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  security-scan:
    image: zaproxy/zap-stable
    container_name: bff-dashboard-sec-zap
    depends_on:
      bff-dashboard:
        condition: service_healthy
    volumes:
      - ./.zap/rules.tsv:/zap/wrk/rules.tsv:ro
      - ./cicd-repo/tests/zap/zap_hooks.py:/zap/wrk/zap_hooks.py:ro
    # -c rules.tsv: informational alerts are set to IGNORE, any other alert
    #   (WARN/FAIL) makes zap-api-scan.py exit non-zero.
    # -z ... replacer: injects ADMIN_JWT on every request (sub=1, the Admin seeded by liquibase,
    #   valid 4 hours, signed by stack_secrets.sh with this run's random JWT_SECRET, MAIR-474),
    #   so every operation is scanned as an authenticated admin.
    # --hook zap_hooks.py: OpenAPI coverage gate, run after the scan (public operations are the
    #   ones the contract marks with `security: []`).
    # -silent: no check-for-update or telemetry when the ZAP daemon starts (otherwise
    #   it can hang on add-on updates and fail with "Failed to connect to ZAP").
    # -z is split with shlex: 'Bearer <jwt>' must stay quoted, otherwise ZAP only
    #   receives "replacement=Bearer" and every authenticated route answers 401.
    # formhandler: ZAP ignores the contract example of a field named "password" and sends
    #   "ZAP", below the 8-character minimum. Defining one field replaces ZAP's whole
    #   default list, so every other field takes its example from the contract.
    command:
      - zap-api-scan.py
      - -t
      - http://bff-dashboard:4007/openapi.json
      - -f
      - openapi
      - -c
      - rules.tsv
      - --hook
      - /zap/wrk/zap_hooks.py
      - -z
      - "-silent -config formhandler.fields.field(0).fieldId=password -config formhandler.fields.field(0).value=Zap-Scan-Passw0rd -config formhandler.fields.field(0).enabled=true -config replacer.full_list(0).description=auth -config replacer.full_list(0).enabled=true -config replacer.full_list(0).matchtype=REQ_HEADER -config replacer.full_list(0).matchstr=Authorization -config replacer.full_list(0).regex=false -config replacer.full_list(0).replacement='Bearer ${ADMIN_JWT:?ADMIN_JWT is signed by stack_secrets.sh, run the matching *_test.sh script}'"
    networks:
      - backend
