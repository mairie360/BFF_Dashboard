services:
  bff-dashboard:
    build: .
    ports:
      - "4007:4007"
    environment:
      PORT: 4007
      USER_BFF_URL: ${USER_BFF_URL:-http://host.docker.internal:4000}
      PROJECT_BFF_URL: ${PROJECT_BFF_URL:-http://host.docker.internal:4001}
      CALENDAR_BFF_URL: ${CALENDAR_BFF_URL:-http://host.docker.internal:4002}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4007/health"]
      interval: 30s
      timeout: 5s
      retries: 3
