# Stack de test de performance ISOLÉE pour le BFF Dashboard.
#
#   ./performance_test.sh          (local)
#   docker compose -f docker-compose-performance.yml up --build \
#       --abort-on-container-exit --exit-code-from k6-perf-test   (CI)
#
# k6-perf-test sort en échec si un seuil de load-test.js est dépassé.
# TARGET_IMAGE (optionnel) : image BFF pré-construite à tester au lieu du build local.
#
# Le Dashboard n'appelle pas d'API directement : il agrège trois BFFs métier
# (User / Project / Calendar). La stack monte donc toute la chaîne amont réelle
# + la base partagée + redis, seedée par init-test.sql. NODE_AUTH_TOKEN doit
# être exporté pour le build local (lecture des packages @mairie360/*).

volumes:
  postgres-data:
  redis-data:

networks:
  backend:

secrets:
  npmrc:
    file: ./.npmrc
  node_auth_token:
    environment: NODE_AUTH_TOKEN

x-db-env: &db-env
  DB_TYPE: postgres
  DB_NAME: mairie_360_database
  DB_USER: postgres
  DB_PASSWORD: password
  DB_HOST: postgres
  DB_PORT: 5432

# Environnement commun aux APIs Rust en amont (core / project / calendar).
x-api-env: &api-env
  <<: *db-env
  HOST: "0.0.0.0"
  REDIS_URL: redis://redis:6379
  JWT_SECRET: secret
  JWT_TIMEOUT: 3600

services:
  postgres:
    image: ${DB_IMAGE:-ghcr.io/mairie360/database:1.3.0}
    container_name: bff-dashboard-perf-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mairie_360_database
    expose:
      - "5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  liquibase:
    image: ${LIQUIBASE_IMAGE:-ghcr.io/mairie360/liquibase-migrations:1.1.0}
    container_name: bff-dashboard-perf-liquibase
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      LIQUIBASE_COMMAND_URL: jdbc:postgresql://postgres:5432/mairie_360_database
      LIQUIBASE_COMMAND_USERNAME: postgres
      LIQUIBASE_COMMAND_PASSWORD: password
      LIQUIBASE_SEARCH_PATH: /migrations
    command: >
      --changelog-file=changelog.xml
      update
    networks:
      - backend

  seeder:
    image: postgres:18-alpine
    container_name: bff-dashboard-perf-seeder
    depends_on:
      liquibase:
        condition: service_completed_successfully
    volumes:
      - ./init-test.sql:/init-test.sql:ro
    environment:
      PGPASSWORD: password
    command: >
      sh -c "psql -h postgres -U postgres -d mairie_360_database -f /init-test.sql"
    networks:
      - backend

  redis:
    image: redis:8.4.0-bookworm
    container_name: bff-dashboard-perf-redis
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- APIs métier en amont (images publiées "distroless" : ni shell ni curl,
  #     la disponibilité est sondée par les sidecars *-ready ci-dessous). ---

  core-api:
    image: ${CORE_API_IMAGE:-ghcr.io/mairie360/core-api:1.1.1}
    container_name: bff-dashboard-perf-core-api
    depends_on:
      liquibase:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      <<: *api-env
      PORT: 3000
      PUBLIC_URL: http://core-api:3000
    expose:
      - "3000"
    networks:
      - backend

  core-api-ready:
    image: curlimages/curl:latest
    container_name: bff-dashboard-perf-core-api-ready
    depends_on:
      core-api:
        condition: service_started
    command: >
      sh -c 'until curl -fsS http://core-api:3000/health >/dev/null; do
      echo "waiting for core-api..."; sleep 2; done; echo "core-api ready"'
    networks:
      - backend

  project-api:
    image: ${PROJECT_API_IMAGE:-ghcr.io/mairie360/project-api:0.4.1}
    container_name: bff-dashboard-perf-project-api
    depends_on:
      liquibase:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      <<: *api-env
      PORT: 3001
      PUBLIC_URL: http://project-api:3001
    expose:
      - "3001"
    networks:
      - backend

  project-api-ready:
    image: curlimages/curl:latest
    container_name: bff-dashboard-perf-project-api-ready
    depends_on:
      project-api:
        condition: service_started
    command: >
      sh -c 'until curl -fsS http://project-api:3001/health >/dev/null; do
      echo "waiting for project-api..."; sleep 2; done; echo "project-api ready"'
    networks:
      - backend

  calendar-api:
    image: ${CALENDAR_API_IMAGE:-ghcr.io/mairie360/calendar-api:0.5.1}
    container_name: bff-dashboard-perf-calendar-api
    depends_on:
      liquibase:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      <<: *api-env
      PORT: 3002
      PUBLIC_URL: http://calendar-api:3002
    expose:
      - "3002"
    networks:
      - backend

  calendar-api-ready:
    image: curlimages/curl:latest
    container_name: bff-dashboard-perf-calendar-api-ready
    depends_on:
      calendar-api:
        condition: service_started
    command: >
      sh -c 'until curl -fsS http://calendar-api:3002/health >/dev/null; do
      echo "waiting for calendar-api..."; sleep 2; done; echo "calendar-api ready"'
    networks:
      - backend

  # --- BFFs métier en amont (images dev publiées par leur propre pipeline). ---

  bff-user:
    image: ${BFF_USER_IMAGE:-ghcr.io/mairie360/bff-user:0.4.0}
    container_name: bff-dashboard-perf-bff-user
    depends_on:
      seeder:
        condition: service_completed_successfully
      core-api-ready:
        condition: service_completed_successfully
    environment:
      <<: *db-env
      HOST: "0.0.0.0"
      PORT: 4000
      REDIS_URL: redis://redis:6379
      JWT_SECRET: secret
      CORE_API_URL: http://core-api:3000
    expose:
      - "4000"
    networks:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  bff-user-ready:
    image: curlimages/curl:latest
    container_name: bff-dashboard-perf-bff-user-ready
    depends_on:
      bff-user:
        condition: service_started
    command: >
      sh -c 'until curl -fsS http://bff-user:4000/health >/dev/null; do
      echo "waiting for bff-user..."; sleep 2; done; echo "bff-user ready"'
    networks:
      - backend

  bff-project:
    image: ${BFF_PROJECT_IMAGE:-ghcr.io/mairie360/bff-project:0.3.0}
    container_name: bff-dashboard-perf-bff-project
    depends_on:
      seeder:
        condition: service_completed_successfully
      project-api-ready:
        condition: service_completed_successfully
      core-api-ready:
        condition: service_completed_successfully
      bff-user-ready:
        condition: service_completed_successfully
    environment:
      <<: *db-env
      HOST: "0.0.0.0"
      PORT: 4001
      REDIS_URL: redis://redis:6379
      CORE_API_URL: http://core-api:3000
      PROJECT_API_BASE_PATH: http://project-api:3001
      USER_BFF_URL: http://bff-user:4000
    expose:
      - "4001"
    networks:
      - backend

  bff-project-ready:
    image: curlimages/curl:latest
    container_name: bff-dashboard-perf-bff-project-ready
    depends_on:
      bff-project:
        condition: service_started
    command: >
      sh -c 'until curl -fsS http://bff-project:4001/health >/dev/null; do
      echo "waiting for bff-project..."; sleep 2; done; echo "bff-project ready"'
    networks:
      - backend

  bff-calendar:
    image: ${BFF_CALENDAR_IMAGE:-ghcr.io/mairie360/bff-calendar:0.3.0}
    container_name: bff-dashboard-perf-bff-calendar
    depends_on:
      seeder:
        condition: service_completed_successfully
      calendar-api-ready:
        condition: service_completed_successfully
      core-api-ready:
        condition: service_completed_successfully
    environment:
      <<: *db-env
      HOST: "0.0.0.0"
      PORT: 4002
      REDIS_URL: redis://redis:6379
      CORE_API_URL: http://core-api:3000
      CALENDAR_API_BASE_PATH: http://calendar-api:3002/api
    expose:
      - "4002"
    networks:
      - backend

  bff-calendar-ready:
    image: curlimages/curl:latest
    container_name: bff-dashboard-perf-bff-calendar-ready
    depends_on:
      bff-calendar:
        condition: service_started
    command: >
      sh -c 'until curl -fsS http://bff-calendar:4002/health >/dev/null; do
      echo "waiting for bff-calendar..."; sleep 2; done; echo "bff-calendar ready"'
    networks:
      - backend

  # --- BFF sous test ---

  bff-dashboard:
    image: ${TARGET_IMAGE:-bff-dashboard:perf}
    container_name: bff-dashboard-perf-bff
    build:
      context: .
      dockerfile: development.Dockerfile
      secrets:
        - npmrc
        - node_auth_token
    command: ["npx", "ts-node", "src/index.ts"]
    depends_on:
      bff-user-ready:
        condition: service_completed_successfully
      bff-project-ready:
        condition: service_completed_successfully
      bff-calendar-ready:
        condition: service_completed_successfully
    environment:
      PORT: 4007
      USER_BFF_URL: http://bff-user:4000
      PROJECT_BFF_URL: http://bff-project:4001
      CALENDAR_BFF_URL: http://bff-calendar:4002
      # Utilisées uniquement par la sonde /check_apis.
      CORE_API_URL: http://core-api:3000
      PROJECT_API_URL: http://project-api:3001
    expose:
      - "4007"
    networks:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4007/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  k6-perf-test:
    image: grafana/k6:latest
    container_name: bff-dashboard-perf-k6
    depends_on:
      bff-dashboard:
        condition: service_healthy
      bff-user:
        condition: service_healthy
    volumes:
      - ./load-test.js:/load-test.js:ro
    environment:
      BASE_URL: http://bff-dashboard:4007
      JWT_SECRET: secret
      PERF_USER_ID: "2"
    command: ["run", "/load-test.js"]
    networks:
      - backend
