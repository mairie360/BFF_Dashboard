# GDPR log marker stack (MAIR-290) for the BFF Dashboard: the services of docker-compose-integration.yml
# (published Core, Project and Calendar API images, seeded database, Redis) plus the `gdpr-marker` runner of
# mairie360/CICD (tests/gdpr/marker), which plays gdpr-marker.yaml with a marker user through the BFF.
# gdpr_marker_test.sh then searches the logs of every container (the BFF, its upstream APIs, Postgres,
# Redis) for its values.
#
#   ./gdpr_marker_test.sh                    (local: builds bff-dashboard:local from development.Dockerfile)
#   IMAGE_REF=<image> ./gdpr_marker_test.sh  (CI: the image promoted to staging)
#
# The session key pair and ADMIN_JWT come from stack_secrets.sh (fresh Ed25519 key pair per run, MAIR-428, MAIR-680).
#
# The Dashboard reads Core API, Project API and Calendar API directly, never another BFF (MAIR-525):
# the stack brings up those three APIs + the shared database + redis, seeded by init-test.sql.

volumes:
  postgres-data:
  redis-data:

networks:
  backend:

x-db-env: &db-env
  DB_TYPE: postgres
  DB_NAME: mairie_360_database
  DB_USER: postgres
  DB_PASSWORD: password
  DB_HOST: postgres
  DB_PORT: 5432

x-api-env: &api-env
  <<: *db-env
  HOST: "0.0.0.0"
  REDIS_URL: redis://redis:6379
  # MAIR-680: Core's public key only, no JWT_SECRET: every HS256 token is refused.
  JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:?JWT_PUBLIC_KEY is generated by stack_secrets.sh, run the matching *_test.sh script}
  JWT_TIMEOUT: 3600

services:
  postgres:
    image: ${DB_IMAGE:-ghcr.io/mairie360/database:dev-c5b8e22}
    container_name: bff-dashboard-gdpr-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mairie_360_database
    expose:
      - "5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  liquibase:
    # Database >= MAIR-413 only seeds the template admin (users.id = 1) with -Dallow_template_admin=true.
    image: ${LIQUIBASE_IMAGE:-ghcr.io/mairie360/liquibase-migrations:dev-c5b8e22}
    container_name: bff-dashboard-gdpr-liquibase
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      LIQUIBASE_COMMAND_URL: jdbc:postgresql://postgres:5432/mairie_360_database
      LIQUIBASE_COMMAND_USERNAME: postgres
      LIQUIBASE_COMMAND_PASSWORD: password
      LIQUIBASE_SEARCH_PATH: /migrations
    command: >
      --changelog-file=changelog.xml
      update
      -Dallow_template_admin=true
    networks:
      - backend

  seeder:
    image: postgres:18-alpine@sha256:1018733457011bf88d81db98cf43aac6d5150afc18787dbe204771fedf80ff95
    container_name: bff-dashboard-gdpr-seeder
    depends_on:
      liquibase:
        condition: service_completed_successfully
    volumes:
      - ./init-test.sql:/init-test.sql:ro
    environment:
      PGPASSWORD: password
    command: >
      sh -c "psql -v ON_ERROR_STOP=1 -h postgres -U postgres -d mairie_360_database -f /init-test.sql"
    networks:
      - backend

  redis:
    image: redis:8.4.0-bookworm@sha256:c22af04bb576503bf16b3e34a1fd2fd82de0f765afd866d2e380145e0af30d78
    container_name: bff-dashboard-gdpr-redis
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  core-api:
    image: ${CORE_API_IMAGE:-ghcr.io/mairie360/core-api:dev-3b40c2a}
    container_name: bff-dashboard-gdpr-core-api
    depends_on:
      liquibase:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      # MAIR-680: Core alone signs the session JWTs (EdDSA) with this run's Ed25519 key pair from
      # stack_secrets.sh; no JWT_SECRET, so no HS256 token is accepted anywhere in the stack.
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:?JWT_PRIVATE_KEY is generated by stack_secrets.sh, run the matching *_test.sh script}
      # Lift the API rate limit (MAIR-425): the scan and the load test hammer it as one user.
      RATE_LIMIT_ENABLED: "false"
      # Core refuses to start without its Resend configuration (MAIR-522). No route of this BFF sends an
      # e-mail, so the key is fake and the URL never called.
      RESEND_API_KEY: "re_fake_local"
      RESEND_BASE_URL: "http://fake-resend.invalid"
      EMAIL_DOMAIN: "mairie360.local"
      <<: *api-env
      PORT: 3000
      PUBLIC_URL: http://core-api:3000
    expose:
      - "3000"
    networks:
      - backend

  core-api-ready:
    image: curlimages/curl:latest@sha256:3fb7e13e5d179a845c97d78204f3f1064d1907037f26a3ebf91710571151fd93
    container_name: bff-dashboard-gdpr-core-api-ready
    depends_on:
      core-api:
        condition: service_started
    # Bounded wait (90 tries, 3 min): an upstream that never answers fails `docker compose up` instead of
    # blocking the gate until the job timeout.
    command: >
      sh -c 'i=0; until curl -fsS http://core-api:3000/health >/dev/null; do
      i=$$((i+1)); if [ $$i -ge 90 ]; then echo "core-api not ready after 3 min"; exit 1; fi;
      echo "waiting for core-api..."; sleep 2; done; echo "core-api ready"'
    networks:
      - backend

  project-api:
    image: ${PROJECT_API_IMAGE:-ghcr.io/mairie360/project-api:dev-4e63d9b}
    container_name: bff-dashboard-gdpr-project-api
    depends_on:
      liquibase:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      <<: *api-env
      PORT: 3001
      PUBLIC_URL: http://project-api:3001
    expose:
      - "3001"
    networks:
      - backend

  project-api-ready:
    image: curlimages/curl:latest@sha256:3fb7e13e5d179a845c97d78204f3f1064d1907037f26a3ebf91710571151fd93
    container_name: bff-dashboard-gdpr-project-api-ready
    depends_on:
      project-api:
        condition: service_started
    # Bounded wait (90 tries, 3 min): an upstream that never answers fails `docker compose up` instead of
    # blocking the gate until the job timeout.
    command: >
      sh -c 'i=0; until curl -fsS http://project-api:3001/health >/dev/null; do
      i=$$((i+1)); if [ $$i -ge 90 ]; then echo "project-api not ready after 3 min"; exit 1; fi;
      echo "waiting for project-api..."; sleep 2; done; echo "project-api ready"'
    networks:
      - backend

  calendar-api:
    image: ${CALENDAR_API_IMAGE:-ghcr.io/mairie360/calendar-api:dev-9c9da5b}
    container_name: bff-dashboard-gdpr-calendar-api
    depends_on:
      liquibase:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      # Lift the API rate limit (MAIR-425): the scan and the load test hammer it as one user.
      RATE_LIMIT_PER_SECOND: "0"
      <<: *api-env
      PORT: 3002
      PUBLIC_URL: http://calendar-api:3002
    expose:
      - "3002"
    networks:
      - backend

  calendar-api-ready:
    image: curlimages/curl:latest@sha256:3fb7e13e5d179a845c97d78204f3f1064d1907037f26a3ebf91710571151fd93
    container_name: bff-dashboard-gdpr-calendar-api-ready
    depends_on:
      calendar-api:
        condition: service_started
    # Bounded wait (90 tries, 3 min): an upstream that never answers fails `docker compose up` instead of
    # blocking the gate until the job timeout.
    command: >
      sh -c 'i=0; until curl -fsS http://calendar-api:3002/health >/dev/null; do
      i=$$((i+1)); if [ $$i -ge 90 ]; then echo "calendar-api not ready after 3 min"; exit 1; fi;
      echo "waiting for calendar-api..."; sleep 2; done; echo "calendar-api ready"'
    networks:
      - backend

  bff-dashboard:
    image: ${IMAGE_REF:-bff-dashboard:local}
    container_name: bff-dashboard-gdpr-bff
    depends_on:
      # The seed must be in before the journey reads the dashboard.
      seeder:
        condition: service_completed_successfully
      core-api-ready:
        condition: service_completed_successfully
      project-api-ready:
        condition: service_completed_successfully
      calendar-api-ready:
        condition: service_completed_successfully
    environment:
      PORT: 4007
      # The APIs, never another BFF (MAIR-525).
      CORE_API_URL: http://core-api:3000
      PROJECT_API_URL: http://project-api:3001
      CALENDAR_API_URL: http://calendar-api:3002
      # Verifies the session tokens before any upstream call (bffs-lib requireSession, MAIR-474).
      # MAIR-680: Core's public key only, no JWT_SECRET: every HS256 token is refused.
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:?JWT_PUBLIC_KEY is generated by stack_secrets.sh, run the matching *_test.sh script}
    expose:
      - "4007"
    networks:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4007/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  gdpr-marker:
    image: node:24-bookworm-slim@sha256:c86ecead9e55a5210ac1727de38a4ca840bf03dcaf34dc9749addbf383b1920c
    container_name: bff-dashboard-gdpr-marker
    user: "${GDPR_UID:-0}:${GDPR_GID:-0}"
    depends_on:
      bff-dashboard:
        condition: service_healthy
    environment:
      # Admin JWT of the run (sub=1, the seeded Admin), EdDSA, signed by stack_secrets.sh like Core.
      ADMIN_JWT: ${ADMIN_JWT:?ADMIN_JWT is generated by stack_secrets.sh, run gdpr_marker_test.sh}
    volumes:
      - ./cicd-repo/tests/gdpr:/engine:ro
      - ./gdpr-marker.yaml:/journey/gdpr-marker.yaml:ro
      - ./gdpr-report:/report
    command: ["/engine/marker/run.sh"]
    networks:
      - backend
